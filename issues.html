<script id="snapshot" type="application/json">{"issues": [{"id": 1, "summary": "Set up USB tooling for talking to the PowerMate on macOS", "type": "task", "priority": "high", "tags": ["tooling"], "description": "Nothing in the project can talk to the device yet. Established: macOS sees the PowerMate (ioreg: 'Griffin PowerMate', VID 0x077D / PID 0x0410, bcdDevice 0x0109, low speed) and has matched it as an IOHIDDevice. Homebrew libusb 1.0 is installed at /opt/homebrew/lib. There are no Python bindings yet ('import hid' and 'import usb' both fail). /usr/bin/python3 is the system Python.\n\nGoal: a project-local venv (.venv, gitignored) with the bindings we need (hidapi for HID reports, pyusb for raw descriptors and vendor control transfers), plus a requirements.txt. Open question: macOS may refuse libusb control transfers or claiming the interface while the HID driver holds it, and reading input may need the Input Monitoring permission. Record what works and what does not.\n\nFindings (2026-09-25): .venv created with hidapi 0.15.0 and pyusb 1.3.1 (requirements.txt; .venv gitignored). pyusb needs the Homebrew backend passed explicitly: usb.backend.libusb1.get_backend(find_library=lambda x: '/opt/homebrew/lib/libusb-1.0.dylib'). No sudo and no Input Monitoring prompt were needed for anything below.\n- hidapi: opens the device (two HID entries, same path: usage page 1 usage 2 Mouse and usage 1 Pointer). read() returns nothing while idle. get_report_descriptor() works.\n- libusb, standard requests to the DEVICE recipient (GET_DESCRIPTOR, GET_STATUS, strings): work.\n- libusb, standard requests to the INTERFACE recipient (bmRequestType 0x81, e.g. HID report descriptor): Errno 13 access denied, because the macOS HID driver owns interface 0. Use hidapi for those.\n- libusb, vendor request to the INTERFACE recipient (0x41, bRequest 0x01, wValue 0x0001, wIndex 255 then 0): accepted, returns 0. Same request to the DEVICE recipient (0x40): Errno 32 pipe error, i.e. the device stalls it.\n\nClosed 2026-09-25: user confirmed on hardware that the LED lit for two 3 s pulses when sent 0x41/0x01/0x0001/255 then 0 via libusb. Tooling works for both paths (hidapi for input and the report descriptor, libusb for device-level descriptors and vendor LED requests). Deliberately not done: packaging or a version pin beyond requirements.txt; the system Python is 3.9.6 and pip is old, which has not caused trouble.", "status": "done", "created": "2026-09-25", "updated": "2026-09-25"}, {"id": 2, "summary": "Dump and decode all USB descriptors (device, config, interface, endpoint, HID, strings)", "type": "discovery", "priority": "high", "tags": ["discovery", "descriptors"], "description": "Capture the raw descriptors and decode them field by field: device descriptor, configuration, interface(s), endpoints (direction, type, max packet size, polling interval), HID class descriptor, the HID report descriptor, and all string descriptors (including serial number if any). Save the raw bytes under captures/ so the documentation can cite them. Depends on #1.\n\nProgress (2026-09-25): raw captures saved in captures/: device_descriptor.bin (18 B), config_descriptor.bin (34 B, includes interface, HID and endpoint descriptors), hid_report_descriptor.bin (50 B), string_descriptors.json. Key facts: USB 1.0, low speed, bMaxPacketSize0 8, bcdDevice 1.09, 1 config (100 mA, bus powered, iConfiguration 'Volume Control'), 1 interface: HID class 3, subclass 1 (boot), protocol 2 (MOUSE), iInterface 'Endpoint 1'. One endpoint 0x81 interrupt IN, wMaxPacketSize 3, bInterval 10 ms. No OUT endpoint. HID descriptor: bcdHID 1.00, country 0, one report descriptor of 50 bytes. The report descriptor is a standard 3-button relative mouse: 3 button bits + 5 padding bits, then X and Y as signed 8-bit relative values (-127..127). No report IDs, no output or feature reports. Strings: 1 manufacturer, 2 product, 3 exists but is EMPTY (iSerialNumber is 0 though, so nothing points at it), 4 'Volume Control', 5 'Endpoint 1', 6+ stall. Remaining: the field-by-field decode written up (belongs in #9's doc).\n\nClosed 2026-09-26 on the user's say-so, after they reviewed docs/USB.md, which holds the field-by-field decode of the device, configuration, interface, HID, endpoint, string and report descriptors. Raw bytes are in captures/.", "status": "done", "created": "2026-09-25", "updated": "2026-09-26"}, {"id": 3, "summary": "Decode the input report: rotation, button and LED status bytes", "type": "discovery", "priority": "high", "tags": ["discovery", "input"], "description": "Hypothesis from the Linux kernel driver (drivers/input/misc/powermate.c), to be verified here and not assumed: a 6-byte interrupt IN report where byte 0 = button (0/1), byte 1 = signed rotation delta, byte 3 = current LED brightness, byte 4 = LED pulse status bits. Verify each byte, the delta range under fast turns, report rate, whether reports arrive when idle, and what the unnamed bytes do. Needs the user to turn and press the knob while a capture runs. Depends on #1 and #2.\n\nNote from #2: the descriptor says 3-byte mouse reports (buttons, X, Y), NOT the 6-byte layout in the Linux driver hypothesis. Which of X or Y carries rotation, and where (if anywhere) LED status appears, is exactly what the capture must show. Since macOS treats the knob as a mouse, turning it may move the cursor.\n\nCapture 1 (2026-09-25, captures/input_session1.jsonl, tools/capture_input.py, 30 s, 331 reports): every report is exactly 3 bytes, matching the descriptor. The 6-byte Linux layout does NOT apply to this unit (bcdDevice 1.09), so the input report carries no LED brightness or pulse status, and LED state cannot be read back this way.\n- Byte 0: buttons. Only bit 0 was ever set (value 1 while pressed). Three press/release pairs were seen, each giving one report on press and one on release.\n- Byte 1 (HID X): signed rotation delta. Clockwise is positive, counter-clockwise negative. Slow turning gives runs of +1/-1 (occasionally 2-3). Fast spins gave up to +19 / -19 per report, so the device accumulates movement between polls rather than sending one report per step.\n- Byte 2 (HID Y): always 0.\n- No reports at all while idle; reports only on change.\n- Shortest gap between reports was about 31 ms, even though bInterval is 10 ms. Unclear whether that limit comes from the device or from how macOS polls a low-speed device.\n- The knob turns smoothly with no detents; the user's 'slow clicks' came out as continuous runs of +1.\nNot yet observed: turning while held down (no report had both button=1 and rotation; the capture probably ended before that step), and counts per full revolution.\n\nCapture 2 (2026-09-25, captures/input_session2.jsonl, 20 s, 133 reports): again all 3-byte, byte 2 always 0. Turning while held IS reported: reports with byte 0 = 1 and a nonzero byte 1 (e.g. +10 and +7 over two held turns), so press and rotation combine in one report. The recorded order did not match the requested steps: a clockwise turn with the button up summing to +103 (1.0-3.2 s), a counter-clockwise turn summing to -111 (10.8-12.9 s), then the held turns at 17.5-20 s. Counts per revolution were pending the user's account of which segment was the full turn.\n\nClosed 2026-09-25. Resolution: roughly 100 counts per revolution. Measured +103 on a hand-marked clockwise turn and the user expects 100. Input report layout is settled: byte 0 bit 0 = button, byte 1 = signed rotation delta (clockwise positive, accumulated between polls, seen up to +/-19), byte 2 = always 0. Press and rotation can appear in the same report. The captures were done by the user on the hardware. Filed separately (#10): an exact counts-per-revolution figure, whether the ~31 ms minimum report interval comes from the device or from macOS, and the largest delta the device can report.", "status": "done", "created": "2026-09-25", "updated": "2026-09-25"}, {"id": 4, "summary": "Discover LED control: static brightness", "type": "discovery", "priority": "high", "tags": ["discovery", "led", "output"], "description": "Find how to set the blue LED's brightness. Hypothesis from the Linux driver: vendor/class control transfers (bmRequestType 0x41, bRequest 0x01 SET_REPORT-like, wValue = command, wIndex = argument) with command 0x01 = SET_STATIC_BRIGHTNESS (0-255). Also check whether a HID output or feature report exists in the report descriptor as an alternative path. Verify with the user watching the LED, and confirm the input report's brightness byte follows. Depends on #1 and #2.\n\nNote from #1/#2: no output or feature reports exist, so vendor control requests are the only LED path. 0x41/0x01/wValue 0x0001/wIndex brightness is accepted through libusb while macOS owns the interface; 0x40 stalls.\n\nConfirmed by user 2026-09-25: wIndex 255 turns the LED fully on and 0 turns it off. Not yet checked: intermediate levels (is it linear, how many real steps), whether the value persists across replug, and whether wValue must be exactly 0x0001.\n\nClosed 2026-09-25. Static brightness: control transfer bmRequestType 0x41 (vendor, interface), bRequest 0x01, wValue 0x0001 (SET_STATIC_BRIGHTNESS), wIndex = level 0-255, no data stage. The user watched a sweep of 0,1,2,4,8,16,32,64,128,255 (3 s each, started by a 3-blink countdown) and reported that the LED is visible from 1 and each step is brighter than the last. So the full 0-255 range is live, and 0 is off. Not measured: the exact brightness curve and how many distinct hardware levels there are (needs a light meter; not worth it). Moved to #6: whether the level persists across unplug/replug, and whether other wValue high bytes are ignored.", "status": "done", "created": "2026-09-25", "updated": "2026-09-25"}, {"id": 5, "summary": "Discover LED pulse modes: speed, awake/asleep pulsing, pulse table", "type": "discovery", "priority": "medium", "tags": ["discovery", "led", "output"], "description": "Linux driver hypothesis: command 0x02 = pulse while host asleep, 0x03 = pulse while awake, 0x04 = pulse mode with wIndex encoding speed (divide/normal/multiply plus a value) and a pulse table (0-2). Map the speed range, what each table looks like, how pulsing interacts with static brightness, and how it shows up in the input report's status byte. Depends on #4.\n\nClosed 2026-09-25 at the user's request. Established: all three pulse commands are accepted by the device (control transfer bmRequestType 0x41, bRequest 0x01, no data stage):\n- Pulse mode: wValue = (table << 8) | 0x04, wIndex = (arg << 8) | op, where op 0 = divide (slower), 1 = normal (arg 0), 2 = multiply (faster).\n- Pulse while awake: wValue 0x0003, wIndex 1 = on, 0 = off.\n- To return to a steady LED: pulse awake off, then static brightness (wValue 0x0001).\nTest run at 21:40 (8 s each, 2 s dark between): A table 0 normal; B table 0 op 0 arg 255; C table 0 op 2 arg 255; D table 1 normal; E table 2 normal. The user reported that pulsing appeared to work but could not tell the settings apart by eye. So on/off is confirmed; what each speed and table value does is NOT established. Moved to #11: measuring pulse period and shape per setting. Pulse-while-asleep (0x02) was not tested and also moved to #11.", "status": "done", "created": "2026-09-25", "updated": "2026-09-25"}, {"id": 6, "summary": "Probe for undocumented requests and edge cases", "type": "discovery", "priority": "low", "tags": ["discovery"], "description": "After the known commands work: try unlisted command values and GET requests carefully (no firmware writes, nothing that looks like DFU), check behaviour on unplug/replug (does LED state persist?), USB suspend, and multiple rapid commands. Record anything found, including 'no effect' results. Depends on #4.\n\nAdded from #4 (2026-09-25): check that the static brightness set via 0x41/0x01/wValue 0x0001 survives unplug/replug (or resets to a default), and whether the high byte of wValue is ignored for command 0x01 (e.g. wValue 0x0101 or 0xFF01).\n\n2026-09-26, reported by the user: LED settings do NOT survive unplug/replug; the device comes back at static brightness 128. So that check is answered (docs/USB.md, 'Power-up and sleep defaults'). Still open here: the wValue high-byte check for command 0x01, unlisted command values, GET requests, rapid-command behaviour.", "status": "open", "created": "2026-09-25", "updated": "2026-09-26"}, {"id": 7, "summary": "Build a reusable Python library and CLI for the PowerMate", "type": "feature", "priority": "medium", "tags": ["code"], "description": "Wrap what #3-#5 establish in a small module (powermate/) with a CLI: 'info' (descriptors), 'watch' (live rotation/button events), 'led' (brightness), 'pulse' (modes). Keep it thin: it exists to test and demonstrate the protocol, not to be a product.\n\nProgress 2026-09-25: package powermate/ (__init__.py: constants, Event, parse_report, pulse_mode_args, PowerMate class; __main__.py: CLI with info, watch, led LEVEL, pulse [--table --op --arg], off). Run as .venv/bin/python -m powermate <cmd>. Verified by me: info prints the same bytes as captures/; led and off are accepted; parse_report over captures/input_session2.jsonl gives net delta +11 and 13 pressed reports, matching the earlier analysis; watch exits 0 on SIGINT.\nLessons: (1) A blocking hid.read() does not return to Python on SIGINT, so watch polls with a 100 ms timeout. (2) hidapi on macOS opens the device EXCLUSIVELY: while one process has it open, a second open() fails with 'OSError: open failed'. A stray watch process caused exactly that. (3) When testing SIGINT from a non-interactive shell, a job started with & ignores SIGINT, so use subprocess.send_signal instead.\nPending: the user trying watch/led/pulse on the hardware, and whether the exclusive open stops the knob moving the macOS cursor.\n\n2026-09-26: the hidapi handle is now opened lazily (PowerMate.hid property, powermate/__init__.py), so LED commands no longer take the exclusive HID open. Verified: with watch running in another process, 'led 0' and 'off' exit 0; 'info' fails with 'OSError: open failed', as expected. The user ran 'off' (via me) and it exited 0.\n\nClosed 2026-09-26: the user ran watch in their own terminal and confirmed it works (events print, Ctrl-C exits). led, pulse and off had been exercised on the hardware during #4/#5 and via the CLI. Deliberately not done: packaging (no pyproject), non-macOS support, a configurable libusb path (hardcoded to /opt/homebrew/lib/libusb-1.0.dylib in powermate/__init__.py).", "status": "done", "created": "2026-09-25", "updated": "2026-09-26"}, {"id": 8, "summary": "Write tests: automated hardware checks plus a guided interactive test", "type": "test", "priority": "medium", "tags": ["test"], "description": "Two layers. (a) Automated: decoding of recorded input reports (runs with no device), and descriptor/LED round-trip checks that run when the device is present and skip otherwise. (b) Interactive: a guided script that asks the user to turn left, turn right, press, and confirm LED states, and records pass/fail. Depends on #7.\n\nProgress 2026-09-26: pytest added (requirements.txt, pytest.ini with pythonpath=.). tests/test_decode.py: 27 offline tests (parse_report cases and length check, replays of both input captures against the recorded analysis, pulse_mode_args encoding and validation, structural checks of the three descriptor captures including 'no output/feature/report-ID items'). tests/test_device.py: 19 hardware tests (descriptors and strings match captures, brightness/pulse accepted, range checks, 0x40 stalls with errno 32, interface standard request denied with errno 13, idle device silent), module-skipped when usb.core.find returns None. Result: 46 passed with the device; with find patched to None, 27 passed and 19 skipped. tools/interactive_test.py: guided test (clockwise, counter-clockwise, 3 presses, press+turn checked automatically; full/dim/off/pulse/pulse-off confirmed by y/n), saves captures/interactive_<time>.json. Waiting on the user to run the interactive test.\n\nClosed 2026-09-26: the user ran tools/interactive_test.py and all 9 steps passed (captures/interactive_20260926_020319.json: half turns gave +56 and -63, 3 presses counted, 23 held-and-turning reports, and the user confirmed full/dim/off/pulse/pulse-off). pytest: 46 passed with the device. Deliberately not done: CI (hardware-bound, single machine), tests for pulse speed/table effects (unknown until #11), sleep/replug behaviour (manual, recorded in docs/USB.md).", "status": "done", "created": "2026-09-25", "updated": "2026-09-26"}, {"id": 9, "summary": "Write the USB protocol reference document", "type": "docs", "priority": "medium", "tags": ["docs"], "description": "docs/USB.md: device identity, full descriptor tables, input report layout, every control request with its parameters and observed effect, pulse behaviour, macOS access notes (permissions, driver conflicts), and a list of what was tested and what was not. Cite captures/ for raw bytes. Plus a short README.md for the project. Depends on #2-#5.\n\nProgress 2026-09-25: docs/USB.md written (identity, device/config/string/report descriptors decoded byte by byte, input report layout and observed behaviour, LED command table with a status column separating confirmed from Linux-derived, macOS access notes, not-tested list) and README.md (setup, CLI usage). Waiting on the user's review. The doc says the knob is 'expected' to move the pointer because nobody has confirmed it.\n\nClosed 2026-09-26: the user reviewed docs/USB.md and said it looks fine. The user confirmed the knob moves the macOS pointer, and the doc now says so. Left open: whether an exclusive hidapi open suppresses pointer movement (#12), and the unmeasured items already tracked in #6, #10 and #11, which the doc's 'Not tested' section and inline issue references point to.", "status": "done", "created": "2026-09-25", "updated": "2026-09-26"}, {"id": 10, "summary": "Pin down rotation resolution, report rate limit and maximum delta", "type": "discovery", "priority": "low", "tags": ["discovery", "input"], "status": "open", "created": "2026-09-25", "updated": "2026-09-25", "description": "Leftover from #3 (see its description and captures/input_session1.jsonl, input_session2.jsonl). Three open measurements: (1) Exact counts per revolution. #3 settled on about 100 (one hand-marked clockwise turn summed to +103; a counter-clockwise turn of unknown extent summed to -111). Do several marked turns each way and average them, or use a jig. (2) The shortest gap between reports was about 31 ms although bInterval is 10 ms. Find out whether the device or macOS's polling of low-speed devices sets that limit, for example by comparing libusb reads on Linux or with a USB analyser. (3) The largest per-report delta. +/-19 was seen in hand spins; the report descriptor allows -127..127."}, {"id": 11, "summary": "Measure LED pulse speed and table behaviour objectively", "type": "discovery", "priority": "low", "tags": ["discovery", "led"], "status": "open", "created": "2026-09-25", "updated": "2026-09-26", "description": "Leftover from #5, which confirmed pulsing turns on and off but not what the parameters do (the user could not tell the five test settings apart by eye). Command encoding is in #5's description. To do: (1) record the LED with a camera (a video-capture tool is available but needs the user's permission and the webcam pointed at the knob), take mean brightness per frame, and get the pulse period and waveform for op 0/1/2 across several arg values and for tables 0, 1, 2; (2) check whether tables above 2 do anything; (3) test pulse-while-asleep (wValue 0x0002, wIndex 0/1), which needs the host to actually sleep; (4) check how a static brightness command behaves while pulsing is on.\n\n2026-09-26, reported by the user: the LED pulses while the Mac is asleep, although we never sent command 0x0002. So pulse-while-asleep is ON by default at power-up (presumably triggered by USB suspend). Recorded in docs/USB.md. Still open for item (3): whether sending 0x0002 with wIndex 0 stops the sleep pulse, and whether settings survive sleep and wake."}, {"id": 12, "summary": "Find out whether an exclusive hidapi open stops the knob moving the pointer", "type": "discovery", "priority": "low", "tags": ["discovery", "macos"], "status": "done", "created": "2026-09-26", "updated": "2026-09-26", "description": "Leftover from #7/#9. Established: macOS treats the PowerMate as a boot mouse, and turning it moves the pointer (user confirmed 2026-09-26). hidapi opens the device exclusively (a second open fails with 'OSError: open failed'). Unknown: whether that exclusive open (IOHIDDeviceOpen with kIOHIDOptionsTypeSeizeDevice) also stops macOS's own mouse handling, i.e. whether the pointer stays still while 'python -m powermate watch' runs. Test: run watch, turn the knob, and watch the pointer. If it still moves and that is unwanted, look at hidapi's hid_darwin_set_open_exclusive or a direct IOKit seize. Update the macOS access notes in docs/USB.md with the answer.\n\nClosed 2026-09-26: the user reported that the pointer stops moving while watch holds the device. So hidapi's exclusive open on macOS also seizes the device from the system's mouse handling, and no extra seize option is needed. docs/USB.md and README.md updated. Not checked: whether knob presses also stop acting as mouse clicks during the open (the interactive test's press step warns about clicks just in case)."}], "roadmap": [{"rank": 1, "id": 6, "why": "The last protocol surface not explored (unlisted commands, GET requests). It could reveal features the docs are missing, so it goes before refining known ones.", "added": "2026-09-26"}, {"rank": 2, "id": 11, "why": "Turns the pulse table in docs/USB.md from 'accepted' into measured behaviour. Needs the camera and the user's permission, so it is scheduled deliberately.", "added": "2026-09-26"}, {"rank": 3, "id": 10, "why": "Precision on figures that are already good enough to use (about 100 counts per turn); lowest value.", "added": "2026-09-26"}]}</script>
<script>
(function () {
  var STATUS_ORDER = ['open', 'in-progress', 'done', 'deferred', 'wontfix'];
  var PRIORITY_ORDER = ['high', 'medium', 'low'];
  var TAG_PILL_LIMIT = 20;   // the rest hide behind a "+N more" toggle
  // Themes are the coarse grouping: one per issue, from a fixed vocabulary,
  // unlike the free-form tags. Order is the order they are worked in.
  var THEME_ORDER = ['trust', 'kit', 'input', 'experience', 'platform', 'storage', 'devices'];
  var LIVE = ['open', 'in-progress'];
  var KEY = 'issues-view:' + location.pathname;
  // Longest alternative first: "jsonl" must win over "json".
  var PATH_RE = /\b((?:[\w.-]+\/)*[\w.-]+\.(?:jsonl|json|md|html|css|js|ts|tsx|jsx|py|rb|go|rs|java|c|h|cpp|sh|toml|ya?ml|cfg|ini|txt|bas|dsk|png))(:\d+(?:-\d+)?)?/g;

  var issues = [];
  var active = { status: [], type: [], tag: [], theme: [] };
  var q = document.getElementById('q');
  var list = document.getElementById('list');
  var count = document.getElementById('count');
  var empty = document.getElementById('empty');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function rank(v, order) {
    var i = order.indexOf(v);
    return i === -1 ? order.length : i;
  }

  function markup(text) {
    return String(text).split('\n\n').map(function (para) {
      return '<p>' + esc(para).replace(PATH_RE, '<code>$&</code>').replace(/\n/g, '<br>') + '</p>';
    }).join('');
  }

  function summaryOf(i) { return i.summary || i.title || '(untitled)'; }
  function tagsOf(i) { return i.tags || i.labels || []; }

  function card(i) {
    var status = i.status || '?', priority = i.priority || '?', type = i.type || '?';
    var el = document.createElement('article');
    el.className = 'card';
    el.id = 'i' + i.id;
    el.dataset.status = status;
    el.dataset.type = type;
    el.dataset.tags = tagsOf(i).join(' ');
    el.dataset.theme = i.theme || '';
    el.innerHTML =
      '<header><button class="row" aria-expanded="false">' +
      '<span class="id">#' + esc(i.id) + '</span>' +
      '<span class="summary">' + esc(summaryOf(i)) + '</span>' +
      '<span class="chips">' +
        '<span class="chip st-' + esc(status) + '">' + esc(status) + '</span>' +
        '<span class="chip pr-' + esc(priority) + '">' + esc(priority) + '</span>' +
        '<span class="chip ty">' + esc(type) + '</span>' +
        (i.theme ? '<span class="chip th">' + esc(i.theme) + '</span>' : '') +
      '</span><span class="caret" aria-hidden="true"></span></button></header>' +
      '<div class="body" hidden><div class="desc">' +
      markup(i.description || '(no description)') + '</div><footer>' +
      tagsOf(i).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') +
      '<span class="meta"><code>' + esc(i.file || '-') + '</code> &middot; created ' +
      esc(i.created || '?') + ' &middot; updated ' + esc(i.updated || '?') +
      '</span></footer></div>';
    el.querySelector('.row').addEventListener('click', function () {
      setOpen(el, el.querySelector('.body').hidden);
    });
    return el;
  }

  function setOpen(el, open) {
    el.querySelector('.row').setAttribute('aria-expanded', open);
    el.querySelector('.body').hidden = !open;
  }

  // The roadmap stores only rank, id and why. Everything shown here is joined
  // from the tracker, so an entry pointing at a missing or finished issue is
  // visibly wrong rather than quietly stale.
  function drawRoadmap(plan, byId) {
    if (!plan.length) return;
    var host = document.getElementById('plan');
    plan.slice().sort(function (a, b) { return (a.rank || 0) - (b.rank || 0); })
      .forEach(function (e) {
        var issue = byId[e.id];
        var li = document.createElement('li');
        li.className = 'step';
        var head, warn = '';
        if (!issue) {
          head = '#' + esc(e.id) + ' is not in the tracker';
          warn = 'no such issue';
          li.className += ' bad';
        } else {
          head = '<a href="#i' + esc(e.id) + '">#' + esc(e.id) + ' ' +
                 esc(summaryOf(issue)) + '</a> <span class="chip st-' +
                 esc(issue.status) + '">' + esc(issue.status) + '</span>';
          if (LIVE.indexOf(issue.status) === -1) {
            warn = 'already ' + issue.status + ', take it off the roadmap';
            li.className += ' bad';
          }
        }
        li.innerHTML = '<span class="rank">' + esc(e.rank || '?') + '.</span>' +
          '<span class="what">' + head +
          '<span class="why">' + esc(e.why || '') + '</span>' +
          (warn ? '<span class="warn">' + esc(warn) + '</span>' : '') + '</span>';
        var link = li.querySelector('a');
        if (link) {
          link.addEventListener('click', function () {
            var target = document.getElementById('i' + e.id);
            if (target) { target.hidden = false; setOpen(target, true); }
          });
        }
        host.appendChild(li);
      });
    document.getElementById('roadmap').hidden = false;
  }

  function pills(host, filter, values, counts, limit) {
    var hidden = (limit && values.length > limit) ? values.length - limit : 0;
    document.getElementById(host).innerHTML = values.map(function (v, idx) {
      var extra = hidden && idx >= limit;
      return '<button class="pill' + (extra ? ' extra' : '') + '"' +
        (extra ? ' hidden' : '') +
        ' data-filter="' + filter + '" data-value="' + esc(v) + '">' +
        esc(v) + (counts ? ' <span class="n">' + counts[v] + '</span>' : '') + '</button>';
    }).join('') + (hidden
      ? '<button class="morebtn" data-host="' + host + '">+' + hidden + ' more</button>'
      : '');
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ active: active, q: q.value }));
    } catch (e) {}
  }

  function apply() {
    var needle = q.value.trim().toLowerCase();
    var shown = 0;
    [].forEach.call(list.children, function (el) {
      var ok =
        (!active.status.length || active.status.indexOf(el.dataset.status) !== -1) &&
        (!active.type.length || active.type.indexOf(el.dataset.type) !== -1) &&
        (!active.theme.length || active.theme.indexOf(el.dataset.theme) !== -1) &&
        (!active.tag.length || active.tag.some(function (t) {
          return el.dataset.tags.split(' ').indexOf(t) !== -1;
        })) &&
        (!needle || el.textContent.toLowerCase().indexOf(needle) !== -1);
      el.hidden = !ok;
      if (ok) shown++;
    });
    empty.hidden = shown !== 0;
    count.textContent = shown + ' of ' + issues.length + ' shown';
    [].forEach.call(document.querySelectorAll('.pill'), function (p) {
      p.setAttribute('aria-pressed', active[p.dataset.filter].indexOf(p.dataset.value) !== -1);
    });
    save();
  }

  function draw(data, plan, note) {
    issues = data.slice().sort(function (a, b) {
      return rank(a.status, STATUS_ORDER) - rank(b.status, STATUS_ORDER) ||
             rank(a.priority, PRIORITY_ORDER) - rank(b.priority, PRIORITY_ORDER) ||
             (a.id || 0) - (b.id || 0);
    });

    var counts = {}, byId = {};
    STATUS_ORDER.forEach(function (s) { counts[s] = 0; });
    issues.forEach(function (i) {
      counts[i.status] = (counts[i.status] || 0) + 1;
      byId[i.id] = i;
    });

    list.innerHTML = '';
    issues.forEach(function (i) { list.appendChild(card(i)); });
    drawRoadmap(plan || [], byId);

    pills('f-status', 'status', STATUS_ORDER.filter(function (s) { return counts[s]; }), counts);
    pills('f-type', 'type', unique(issues.map(function (i) { return i.type || '?'; })));

    var themeCounts = {};
    issues.forEach(function (i) {
      if (i.theme) themeCounts[i.theme] = (themeCounts[i.theme] || 0) + 1;
    });
    var themes = THEME_ORDER.filter(function (t) { return themeCounts[t]; })
      .concat(Object.keys(themeCounts).filter(function (t) {
        return THEME_ORDER.indexOf(t) === -1;
      }).sort());
    document.getElementById('f-theme').parentNode.hidden = !themes.length;
    pills('f-theme', 'theme', themes, themeCounts);
    // A project can accumulate hundreds of tags, most of them used once.
    // Showing every one buries the results, so lead with the most used and
    // keep the long tail behind a toggle.
    var tagCounts = {};
    issues.forEach(function (i) {
      tagsOf(i).forEach(function (t) { tagCounts[t] = (tagCounts[t] || 0) + 1; });
    });
    var tagNames = Object.keys(tagCounts).sort(function (a, b) {
      return tagCounts[b] - tagCounts[a] || (a < b ? -1 : a > b ? 1 : 0);
    });
    pills('f-tag', 'tag', tagNames, tagCounts, TAG_PILL_LIMIT);

    [].forEach.call(document.querySelectorAll('.pill'), function (p) {
      p.addEventListener('click', function () {
        var l = active[p.dataset.filter], i = l.indexOf(p.dataset.value);
        if (i === -1) l.push(p.dataset.value); else l.splice(i, 1);
        apply();
      });
    });

    [].forEach.call(document.querySelectorAll('.morebtn'), function (b) {
      b.addEventListener('click', function () {
        var host = document.getElementById(b.dataset.host);
        var extras = host.querySelectorAll('.pill.extra');
        var show = extras.length && extras[0].hidden;
        [].forEach.call(extras, function (p) { p.hidden = !show; });
        b.textContent = show ? 'fewer' : '+' + extras.length + ' more';
      });
    });

    var open = (counts.open || 0) + (counts['in-progress'] || 0);
    document.getElementById('lede').innerHTML =
      issues.length + ' issues, ' + open + ' of them still open' +
      ((plan && plan.length) ? ', ' + plan.length + ' on the roadmap' : '') +
      '. Read from <code>issues.jsonl</code>.';
    if (note) {
      var n = document.getElementById('note');
      n.textContent = note;
      n.hidden = false;
    }

    try {
      var s = JSON.parse(localStorage.getItem(KEY) || '{}');
      if (s.active) active = s.active;
      if (s.q) q.value = s.q;
    } catch (e) {}

    apply();

    if (location.hash) {
      var target = document.querySelector(location.hash);
      if (target && target.classList.contains('card')) {
        target.hidden = false;
        setOpen(target, true);
        target.scrollIntoView();
      }
    }
  }

  function unique(a) {
    return a.filter(function (v, i) { return a.indexOf(v) === i; }).sort();
  }

  q.addEventListener('input', apply);
  document.getElementById('reset').addEventListener('click', function () {
    active = { status: [], type: [], tag: [], theme: [] };
    q.value = '';
    apply();
  });
  document.getElementById('expand').addEventListener('click', function () {
    [].forEach.call(list.children, function (c) { if (!c.hidden) setOpen(c, true); });
  });
  document.getElementById('collapse').addEventListener('click', function () {
    [].forEach.call(list.children, function (c) { setOpen(c, false); });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
    if (e.key === 'Escape' && document.activeElement === q) { q.value = ''; apply(); }
  });

  function lines(text) {
    return text.split('\n').filter(function (l) { return l.trim(); }).map(JSON.parse);
  }

  function grab(name) {
    return fetch(name, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(lines);
  }

  // The live files first. Browsers refuse a file:// fetch, so fall back to the
  // snapshot baked in at build time and say which one is on screen. A missing
  // roadmap.jsonl is not an error: the section just stays hidden.
  grab('issues.jsonl')
    .then(function (data) {
      grab('roadmap.jsonl')
        .catch(function () { return []; })
        .then(function (plan) { draw(data, plan); });
    })
    .catch(function () {
      var snap = JSON.parse(document.getElementById('snapshot').textContent);
      draw(snap.issues, snap.roadmap,
        'Showing the snapshot saved when this page was last built, because the browser would ' +
        'not read the .jsonl files from disk. To see them live, serve the directory ' +
        '(python3 -m http.server) and open it over http, or rebuild this page.');
    });
})();
</script>
</body>
</html>
